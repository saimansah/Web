<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#8000ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="sLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ff00a0" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Shield Badge -->
  <polygon points="100,12 178,52 178,148 100,188 22,148 22,52" fill="rgba(11, 15, 25, 0.9)" stroke="url(#cyberGrad)" stroke-width="5" filter="url(#neonGlow)" />
  <!-- Inner Frame Accent -->
  <polygon points="100,24 166,58 166,142 100,176 34,142 34,58" fill="none" stroke="rgba(0, 243, 255, 0.3)" stroke-width="2" />
  <!-- Stylized Cyber S Logo -->
  <path d="M 132 68 C 132 50, 114 42, 96 42 C 72 42, 58 54, 58 72 C 58 98, 142 92, 142 128 C 142 154, 116 164, 92 164 C 68 164, 52 148, 50 132" 
        fill="none" stroke="url(#sLetterGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <!-- Decorative Tech Nodes -->
  <circle cx="100" cy="24" r="3" fill="#00f3ff" />
  <circle cx="166" cy="58" r="3" fill="#00f3ff" />
  <circle cx="166" cy="142" r="3" fill="#ff0055" />
  <circle cx="100" cy="176" r="3" fill="#ff0055" />
  <circle cx="34" cy="142" r="3" fill="#ff0055" />
  <circle cx="34" cy="58" r="3" fill="#00f3ff" />
</svg>
