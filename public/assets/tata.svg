<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>Tata</title>
  <rect width="48" height="48" rx="10" fill="#0D1A30" />
  <!-- Tata oval emblem -->
  <ellipse cx="24" cy="20" rx="15" ry="11" stroke="#0072CE" stroke-width="2.5" fill="none" />
  <!-- Iconic central upward curved arms -->
  <path d="M16 26 C16 16, 23 13, 23.5 13 C23.5 13, 21 18, 21 26" fill="#00A3E0" />
  <path d="M32 26 C32 16, 25 13, 24.5 13 C24.5 13, 27 18, 27 26" fill="#00A3E0" />
  <!-- TATA wordmark -->
  <text x="24" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">TATA</text>
</svg>
